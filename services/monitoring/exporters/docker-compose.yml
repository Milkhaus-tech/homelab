services:
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    environment:
      - CADVISOR_HEALTHCHECK_URL=http://localhost:8098/healthz
    command:
      - '--port=8098' # 8080 is taken by qBittorrent WebUI
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg

  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-sonarr
    restart: unless-stopped
    network_mode: host
    command: ["sonarr"]
    environment:
      - PORT=9707
      - URL=http://192.168.1.10:8989
      - APIKEY=${SONARR_API_KEY}

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-radarr
    restart: unless-stopped
    network_mode: host
    command: ["radarr"]
    environment:
      - PORT=9708
      - URL=http://192.168.1.10:7878
      - APIKEY=${RADARR_API_KEY}

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-prowlarr
    restart: unless-stopped
    network_mode: host
    command: ["prowlarr"]
    environment:
      - PORT=9709
      - URL=http://192.168.1.10:9696
      - APIKEY=${PROWLARR_API_KEY}
