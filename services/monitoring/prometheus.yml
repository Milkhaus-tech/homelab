global:
  scrape_interval: 15s # How often to grab stats

scrape_configs:
  - job_name: 'node_stats'
    static_configs:
      - targets:
          - '192.168.1.10:9100'  # Noahlab
          - '192.168.1.11:9100'  # Jesus
          - '192.168.1.12:9100'  # Pablo
          - '192.168.1.13:9100'  # Noah Desktop

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.1.10:8098']

  - job_name: 'exportarr'
    static_configs:
      - targets:
          - '192.168.1.10:9707'  # sonarr
          - '192.168.1.10:9708'  # radarr
          - '192.168.1.10:9709'  # prowlarr

  - job_name: 'jellyfin'
    static_configs:
      - targets: ['192.168.1.10:8096']

  - job_name: 'frigate'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['192.168.1.10:5000']

  - job_name: 'homeassistant'
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/ha_token
    static_configs:
      - targets: ['192.168.1.10:8123']
