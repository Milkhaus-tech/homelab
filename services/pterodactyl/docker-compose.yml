services:
  database:
    image: mariadb:10.11
    restart: always
    command: --ssl=0
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MARIADB_AUTO_UPGRADE: "true"
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"

  cache:
    image: redis:alpine
    restart: always

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "8081:80"
    links:
      - database
      - cache
    volumes:
      - ./var/:/app/var/
      - ./logs/:/app/storage/logs
      - ./themes/public:/app/public/themes/milkhaus:ro
      - ./themes/wrapper.blade.php:/app/resources/views/templates/wrapper.blade.php:ro
      - ./themes/admin.blade.php:/app/resources/views/layouts/admin.blade.php:ro
    environment:
      APP_URL: https://panel.milkhaus.net
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: admin@milkhaus.net
      APP_ENVIRONMENT_ONLY: "true"
      TRUSTED_PROXIES: "*"
      LARAVEL_PROXY_IDS: "*"
      LARAVEL_PROXY_HEADERS: "X-Forwarded-For,X-Forwarded-Proto,X-Forwarded-Port"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      SESSION_SECURE_COOKIE: "true"
      MAIL_MAILER: smtp
      MAIL_DRIVER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_ENCRYPTION: tls
      MAIL_USERNAME: "${MAIL_USERNAME}"
      # MAIL_PASSWORD lives in var/.env (git-excluded)
      MAIL_FROM: "${MAIL_USERNAME}"
      MAIL_FROM_ADDRESS: "${MAIL_USERNAME}"
      MAIL_FROM_NAME: "Pterodactyl Panel"
