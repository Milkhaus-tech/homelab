  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - PORT=11011
    volumes:
      - ./config/cleanuparr:/config
    ports:
      - 11011:11011
    restart: always

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    volumes:
      # Matches the exact mount path used by your *Arr and qBittorrent apps
      - /mnt/media:/media
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000

      # SONARR CONFIGURATION
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/media

      # RADARR CONFIGURATION
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/media

      # EXTRACTION SETTINGS
      # Clean up extracted files 5 minutes after Radarr/Sonarr import them
      - UN_DAEMON_DELETE_DELAY=5m
    restart: always

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/bazarr:/config
      - /mnt/media:/media
    ports:
      - 6767:6767
    restart: always

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "1000:1000"
    environment:
      - TZ=America/Los_Angeles
      - CRON_SCHEDULE=0 5 * * *
    volumes:
      - ./config/recyclarr:/config
    restart: always

  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    user: "1000:1000"
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./config/autobrr:/config
    ports:
      - 7474:7474
    restart: always

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: cross-seed
    user: "1000:1000"
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./config/cross-seed:/config
      - /mnt/media:/media
    command: daemon
    restart: always
