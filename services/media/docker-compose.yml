services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
      - WIREGUARD_MTU=1420
      - BLOCK_MALICIOUS=off
      - FIREWALL_VPN_INPUT_PORTS=48592
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53
      - HEALTH_TARGET_ADDRESSES=1.1.1.1:443,8.8.8.8:443
    ports:
      - 8080:8080 # qBittorrent WebUI
      - 48592:48592/tcp
      - 48592:48592/udp
    restart: always

  qbittorrent:

    cpuset: "0-9"    # keep off cores 10-15, reserved for game servers
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true # recreate qbittorrent whenever gluetun is recreated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config:/config
      - /mnt/media:/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/app/version"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: always

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    network_mode: host
    environment:
      - LOG_LEVEL=info
      - TZ=America/Los_Angeles
    volumes:
      - ./config/jellyseerr:/app/config
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/radarr:/config
      - /mnt/media:/media
    ports:
      - 7878:7878
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: always

  sonarr:

    cpuset: "0-9"    # keep off cores 10-15, reserved for game servers
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/sonarr:/config
      - /mnt/media:/media
    ports:
      - 8989:8989
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: always

  jfa-go:
    image: hrfee/jfa-go
    container_name: jfa-go
    restart: always
    ports:
      - "8056:8056"
    volumes:
      - ./jfa-go/config:/data
      - ../jellyfin/config:/jb:ro # Jellyfin appdata (password resets)
    environment:
      - TZ=America/Los_Angeles

  # tdarr retired 2026-08-08 (no transcoding needed). Data kept in ~/docker/tdarr/. Uncomment to restore.
