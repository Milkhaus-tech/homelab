      message: Motion at the front door
      data:
        image: /local/doorbell_latest.jpg
  - action: notify.mobile_app_partner_iphone
    data:
      title: Doorbell
      message: Motion at the front door
      data:
        image: /local/doorbell_latest.jpg
  mode: queued
  max: 5
- id: donetick_chore_notifications
  alias: 'Chore Chart: Donetick notifications'
  description: Relays Donetick chore webhooks to partner's phone only; Noah's chore notifications
    go through Westly
  triggers:
  - trigger: webhook
    webhook_id: <redacted>
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.json.type == ''task.reminder'' and trigger.json.data.assignee_username
          == ''partner'' }}'
      sequence:
      - action: notify.mobile_app_partner_iphone
        data:
          title: '{{ {''pre_due'': ''Chore coming up'', ''due'': ''Chore due'', ''overdue'':
            ''Chore overdue''}.get(trigger.json.data.type, ''Chore reminder'') }}'
          message: '{{ trigger.json.data.name }}'
          data:
            url: http://192.168.1.10:2021/chores
    - conditions:
      - condition: template
        value_template: '{{ trigger.json.type == ''task.completed'' and trigger.json.data.username
          == ''noah'' }}'
      sequence:
      - action: notify.mobile_app_partner_iphone
        data:
          title: Chore done ✓
          message: '{{ trigger.json.data.display_name }} finished: {{ trigger.json.data.chore.name
            }}'
          data:
            url: http://192.168.1.10:2021/chores
  mode: queued
  max: 10
- id: tv_search_passthrough
  alias: TV keyboard passthrough
  description: Type text entered in input_text.tv_search_query into the Fire TV's
    focused field, then clear the box
  trigger:
  - platform: state
    entity_id: input_text.tv_search_query
  condition:
  - condition: template
    value_template: '{{ trigger.to_state.state | trim != '''' }}'
  action:
  - action: script.tv_type
    data:
      text: '{{ trigger.to_state.state }}'
  - delay:
      seconds: 1
  - action: input_text.set_value
    target:
      entity_id: input_text.tv_search_query
    data:
      value: ''
  mode: queued
- id: downstairs_presence_lights
  alias: 'Downstairs: lights follow presence'
  description: Lights on when a person appears, they are off and the sun is low; off
    after 10 min of vacancy. Suspended while the TV is playing/paused; re-evaluated
    30 s after playback ends.
  triggers:
  - trigger: state
    entity_id: binary_sensor.downstairs_person
    to: 'on'
    id: enter
  - trigger: state
    entity_id: binary_sensor.downstairs_person
    to: 'off'
    for: '00:10:00'
    id: leave
  - trigger: state
    entity_id: sensor.living_room_jellyfin_playback
    to: idle
    for: '00:00:30'
    id: playback_ended
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.living_room_jellyfin_playback
      state:
      - playing
      - paused
  actions:
  - variables:
      lit: "{{ expand('light.downstairs_lights') | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      # auto-on only when the sun is this low (degrees); ~1 h before sunset here. Raise if the room is dim earlier.
      dark_below_elevation: 10
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''leave'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.downstairs_lights
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''playback_ended'' }}'
      - condition: state
        entity_id: binary_sensor.downstairs_person
        state: 'off'
        for: '00:10:00'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.downstairs_lights
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''playback_ended'' }}'
      - condition: template
        value_template: '{{ lit | count > 0 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ lit }}'
        data:
          brightness_pct: 100
          transition: 2
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''enter'', ''playback_ended''] }}'
      - condition: state
        entity_id: binary_sensor.downstairs_person
        state: 'on'
      - condition: state
        entity_id: light.downstairs_lights
        state: 'off'
      - condition: template
        value_template: '{{ state_attr(''sun.sun'', ''elevation'') | float(0) < dark_below_elevation }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.downstairs_lights
        data:
          brightness_pct: 100
  mode: restart
- id: downstairs_jellyfin_dims_lights
  alias: 'Downstairs: dim lights for Jellyfin'
  description: Fire TV Jellyfin session - playing 1%, paused (>10 s) 15%. Only
    touches bulbs that are already on; restoring to 100% when playback ends lives
    in the presence automation.
  triggers:
  - trigger: state
    entity_id: sensor.living_room_jellyfin_playback
    to: playing
  - trigger: state
    entity_id: sensor.living_room_jellyfin_playback
    to: paused
    for: '00:00:10'
  - trigger: state  # Govee LAN bulbs drop off and rejoin; re-apply the level when one comes back
    entity_id: [light.kitchen1_local, light.kitchen2_local, light.kitchen3_local, light.kitchen4_local,
      light.living_room_living_room_1, light.living_room_living_room_2, light.living_room_living_room_3, light.living_room_living_room_4]
    from: unavailable
    for: '00:00:05'
    id: bulb_back
  conditions:
  - condition: template
    value_template: >-
      {{ is_state('sensor.living_room_jellyfin_playback', ['playing', 'paused']) if trigger.id == 'bulb_back'
         else trigger.from_state.state in ['playing', 'paused', 'idle'] }}
  actions:
  - variables:
      levels:
        playing: 1
        paused: 15
      lit: "{{ expand('light.downstairs_lights') | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
  - condition: template
    value_template: '{{ lit | count > 0 }}'
  - action: light.turn_on
    target:
      entity_id: '{{ lit }}'
    data:
      brightness_pct: "{{ levels[states('sensor.living_room_jellyfin_playback')] }}"
      transition: 3
  mode: restart
- id: ipad_panel_brightness_follows_presence
  alias: 'iPad panel: screen follows presence'
  description: >-
    Kiosk iPad wakes when someone is downstairs and Jellyfin is not playing; shows the kiosk
    screensaver after 5 min of vacancy or while Jellyfin plays. Screensaver mode/dim level are
    set in the companion app. Commands are only honoured while the app is open in the foreground.
  triggers:
  - trigger: state
    entity_id: binary_sensor.downstairs_person
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.downstairs_person
    to: 'off'
    for: '00:05:00'
  - trigger: state
    entity_id: sensor.living_room_jellyfin_playback
    to: playing
  - trigger: state
    entity_id: sensor.living_room_jellyfin_playback
    to: idle
    for: '00:00:30'
  conditions: []
  actions:
  - variables:
      sleep: "{{ not (is_state('binary_sensor.downstairs_person', 'on') and not is_state('sensor.living_room_jellyfin_playback', 'playing')) }}"
      screensaver_pct: 10  # app default was 40, too bright for a dark room; raise if it is unreadable
  - if:
    - condition: template
      value_template: '{{ sleep }}'
    then:
    - action: notify.mobile_app_ipad_panel
      data:
        message: kiosk_set_screensaver_brightness
        data:
          level: '{{ screensaver_pct }}'
    - delay: '00:00:01'  # APNs does not guarantee order; let the level land before the screensaver draws
  - action: notify.mobile_app_ipad_panel
    data:
      message: "{{ 'kiosk_show_screensaver' if sleep else 'kiosk_hide_screensaver' }}"
  mode: restart
