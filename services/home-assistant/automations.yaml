- id: '1781741606110'
  alias: Away on Leave
  description: Sets ecobee to away comfort state when everyone leaves the house
  triggers:
  - trigger: zone.left
    target:
      entity_id: person.partner
    options:
      for: 00:00:00
      zone: zone.home
  - trigger: zone.left
    target:
      entity_id: person.noah
    options:
      for: 00:00:00
      zone: zone.home
  - trigger: zone.entered
    target:
      entity_id: person.noah
    options:
      for: 00:00:00
      zone: zone.work
  - trigger: zone.entered
    target:
      entity_id: person.partner
    options:
      for: 00:00:00
      zone: zone.work
  - trigger: state
    entity_id:
    - binary_sensor.192_168_1_100
    to:
    - 'off'
  - trigger: zone.occupancy_cleared
    options:
      for: 00:00:00
      zone: zone.home
  conditions:
  - condition: zone.occupancy_is_not_detected
    options:
      for: 00:00:00
      zone: zone.home
  actions:
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: select_option
    option: away
  mode: single
