- id: '1781829069343'
  alias: Check if Away
  description: Polls every 15s so an away transition still happens if the zone trigger
    is missed. The "not already away" condition is what stops it re-sending on every
    tick and overriding a manual thermostat change. Runs through the 18:00-21:00 peak
    so device-side flips to home in an empty house get corrected; only the 16:30-18:00
    precool window is excluded. Clear-hold precedes the write; the ecobee silently
    ignores mode writes while a hold is active.
  triggers:
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: current_option_changed
    trigger: device
    from: away
    to: home
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: current_option_changed
    trigger: device
    from: away
    to: sleep
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: time_pattern
    seconds: /15
  conditions:
  - condition: zone.occupancy_is_not_detected
    options:
      for: 00:00:00
      zone: zone.home
  - condition: time
    after: '17:59:00'
    before: '16:30:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
    - sat
  - condition: not
    conditions:
    - condition: device
      device_id: 9bd7df2aa66155f9449e04ca66efb33b
      domain: select
      entity_id: b23294749e4bc20810123958161f04ed
      type: selected_option
      option: away
  actions:
  - action: button.press
    target:
      entity_id: button.kitchen_thermostat_clear_hold
  - delay:
      seconds: 20
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: select_option
    option: away
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - select.kitchen_thermostat_current_mode
      to: away
    timeout:
      seconds: 90
  mode: single
- id: '1782123219661'
  alias: Check if Home
  description: Recovery poller for a missed home transition. Weekday list must stay
    in sync with "Check if Away" — when this ran mon-fri only, an away state set on
    Friday night persisted all weekend. Clear-hold precedes the write; the ecobee
    silently ignores mode writes while a hold is active.
  triggers:
  - trigger: time_pattern
    seconds: /30
  - type: connected
    device_id: d72805ac47c71d482fc334f5c975703f
    entity_id: 73f5b7d1e6e3027f7a3f7dd9a8fdd8c9
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: zone.occupancy_is_detected
    options:
      for: 00:00:00
      zone: zone.home
  - condition: time
    before: '18:00:00'
    after: '21:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
    - sat
  - condition: device
    device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: selected_option
    option: away
  actions:
  - action: button.press
    target:
      entity_id: button.kitchen_thermostat_clear_hold
  - delay:
      seconds: 20
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: select_option
    option: home
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - select.kitchen_thermostat_current_mode
      to: home
    timeout:
      seconds: 90
  mode: single
- id: doorbell_simple_record
  alias: D205 Record on Wake
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - select.tapodoorbell_motion_detection
    to:
    - 'on'
  conditions: []
  actions:
  - delay:
      seconds: 3
