- id: '1781829069343'
  alias: Check if Away
  description: Polls every 15s so an away transition still happens if the zone trigger
    is missed. The "not already away" condition is what stops it re-sending on every
    tick and overriding a manual thermostat change.
  triggers:
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: current_option_changed
    trigger: device
    from: away
    to: home
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: current_option_changed
    trigger: device
    from: away
    to: sleep
    for:
      hours: 0
      minutes: 45
      seconds: 0
  - trigger: time_pattern
    seconds: /15
  conditions:
  - condition: zone.occupancy_is_not_detected
    options:
      for: 00:00:00
      zone: zone.home
  - condition: time
    after: '21:00:00'
    before: '18:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
    - sat
  - condition: time
    after: '17:59:00'
    before: '16:30:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
    - sat
  - condition: not
    conditions:
    - condition: device
      device_id: 9bd7df2aa66155f9449e04ca66efb33b
      domain: select
      entity_id: b23294749e4bc20810123958161f04ed
      type: selected_option
      option: away
  actions:
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: select_option
    option: away
  mode: single
