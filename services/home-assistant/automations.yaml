- id: '1782123219661'
  alias: Check if Home
  description: Recovery poller for a missed home transition. Weekday list must stay
    in sync with "Check if Away" — when this ran mon-fri only, an away state set on
    Friday night persisted all weekend.
  triggers:
  - trigger: time_pattern
    seconds: /30
  - type: connected
    device_id: d72805ac47c71d482fc334f5c975703f
    entity_id: 73f5b7d1e6e3027f7a3f7dd9a8fdd8c9
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: zone.occupancy_is_detected
    options:
      for: 00:00:00
      zone: zone.home
  - condition: time
    before: '18:00:00'
    after: '21:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sun
    - sat
  - condition: device
    device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: selected_option
    option: away
  actions:
  - device_id: 9bd7df2aa66155f9449e04ca66efb33b
    domain: select
    entity_id: b23294749e4bc20810123958161f04ed
    type: select_option
    option: home
  mode: single
- id: pump_failsafe_off
  alias: Pump failsafe off
  description: Backstop for Morning Water and Recovery Water. Their 2-minute delay
    lives in memory, so a restart or reload mid-run drops the turn_off and leaves the
    pump running indefinitely. The start trigger catches a pump already on when HA
    comes back; the 5-minute state trigger catches every other way it gets stuck,
    including a manual turn-on that is never turned off.
  triggers:
  - trigger: state
    entity_id:
    - switch.backyard_tp_link_smart_plug_pump_1
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: switch.backyard_tp_link_smart_plug_pump_1
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.backyard_tp_link_smart_plug_pump_1
    data: {}
  mode: single
- id: doorbell_simple_record
  alias: D205 Record on Wake
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - select.tapodoorbell_motion_detection
    to:
    - 'on'
  conditions: []
  actions:
  - delay:
      seconds: 3
  - action: camera.record
    data:
      filename: /media/doorbell/{{ now().strftime('%Y%m%d_%H%M%S') }}.mp4
      duration: 20
      lookback: 3
    target:
      entity_id: camera.tapodoorbell_hd_stream_direct
  - action: camera.snapshot
    data:
      entity_id: camera.tapodoorbell_hd_stream_direct
      filename: /config/www/doorbell_latest.jpg
  - action: notify.mobile_app_apple_square_v2
    data:
      title: Doorbell
      message: Motion at the front door
      data:
        image: /local/doorbell_latest.jpg
  - action: notify.mobile_app_partner_iphone
    data:
      title: Doorbell
      message: Motion at the front door
      data:
        image: /local/doorbell_latest.jpg
  mode: queued
  max: 5
- id: donetick_chore_notifications
  alias: 'Chore Chart: Donetick notifications'
  description: Relays Donetick chore webhook events (reminders and completions) to phones
  triggers:
  - trigger: webhook
    webhook_id: <redacted>
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.type == 'task.reminder' }}"
      sequence:
      - action: notify.mobile_app_{{ 'partner_iphone' if trigger.json.data.assignee_username == 'partner' else 'apple_square_v2' }}
        data:
          title: "{{ {'pre_due': 'Chore coming up', 'due': 'Chore due', 'overdue': 'Chore overdue'}.get(trigger.json.data.type, 'Chore reminder') }}"
          message: '{{ trigger.json.data.name }}'
          data:
            url: http://192.168.1.10:2021/chores
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.type == 'task.completed' }}"
      sequence:
      - action: notify.mobile_app_{{ 'partner_iphone' if trigger.json.data.username == 'noah' else 'apple_square_v2' }}
        data:
          title: Chore done ✓
          message: '{{ trigger.json.data.display_name }} finished: {{ trigger.json.data.chore.name }}'
          data:
            url: http://192.168.1.10:2021/chores
  mode: queued
  max: 10
- id: vd_attention
  alias: 'Virtual desktop: needs attention'
  description: Relays vd-flag webhooks (agent blocked on login/2FA/captcha) to Noah's phone
  triggers:
  - trigger: webhook
    webhook_id: <redacted>
    allowed_methods:
    - POST
    local_only: true
  conditions: []
  actions:
  - action: notify.mobile_app_apple_square_v2
    data:
      title: Virtual desktop needs you
      message: "{{ trigger.json.reason | default('(no reason given)') }}"
      data:
        push:
          interruption-level: time-sensitive
  mode: queued
  max: 10
