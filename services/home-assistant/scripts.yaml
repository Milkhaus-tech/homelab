feed_gumball_1_portion:
  alias: Feed Gumball 1 Portion
  description: Feeds Gumball's feeder directly over the LAN (no Tuya cloud); pushes
    a phone alert if the feeder does not ack.
  sequence:
  - action: shell_command.feed_tuya
    data:
      feeder: gumball
      portions: 1
    response_variable: feed
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ feed is not defined or feed.returncode != 0 }}'
    then:
    - action: notify.mobile_app_apple_square_v2
      data:
        title: Feed Gumball failed
        message: '{{ ((feed.stderr or feed.stdout) if feed is defined else "shell_command did not run") | truncate(180) }}'
