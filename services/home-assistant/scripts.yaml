feed_cat_1_portion:
  alias: Feed Cat 1 Portion
  sequence:
  - target:
      entity_id: number.smart_pet_feeder_feed
    data:
      value: 1
    action: number.set_value
  description: ''
launch_jellyfin:
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.living_room_living_room_tv
    data:
      command: am start -n org.jellyfin.androidtv/org.jellyfin.androidtv.ui.MainActivity
  alias: Launch Jellyfin
  description: ''
ptz_left_1s:
  alias: PTZ Left 1s
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.active_ptz_camera
        state: tapo_1
      sequence:
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_1
          action: move
          argument: left
      - delay:
          milliseconds: 500
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_1
          action: stop
    - conditions:
      - condition: state
        entity_id: input_select.active_ptz_camera
        state: tapo_2
      sequence:
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_2
          action: move
          argument: left
      - delay:
          milliseconds: 500
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_2
          action: stop
