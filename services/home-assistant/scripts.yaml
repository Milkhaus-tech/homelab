tv_launch_app:
  alias: TV - Launch App
  description: Wake the Fire TV, dismiss the screensaver if showing, launch an app by package
  fields:
    package:
      required: true
      example: org.jellyfin.androidtv
  sequence:
  - action: media_player.turn_on
    target:
      entity_id: media_player.living_room_living_room_tv
  - action: androidtv.adb_command
    target:
      entity_id: media_player.living_room_living_room_tv
    data:
      command: >-
        input keyevent 224; sleep 1; dumpsys activity activities | grep -q com.amazon.ftv.screensaver && input keyevent 4 && sleep 1; monkey -p {{ package }} -c android.intent.category.LEANBACK_LAUNCHER 1

launch_jellyfin:
  alias: Launch Jellyfin
  description: ''
  sequence:
  - action: script.tv_launch_app
    data:
      package: org.jellyfin.androidtv

tv_send_keyevent:
  alias: TV - Send Keyevent
  description: Send a single Android keyevent code to the Fire TV (dpad, back, home, menu, ...)
  fields:
    keycode:
      required: true
      example: 19
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.living_room_living_room_tv
    data:
      command: input keyevent {{ keycode }}

tv_type:
  alias: TV - Type Text
  description: Type text into whatever field is focused on the Fire TV, then press Enter (keyboard passthrough from the kiosk)
  mode: queued
  fields:
    text:
      required: true
      example: the office
  sequence:
  - action: androidtv.adb_command
    target:
      entity_id: media_player.living_room_living_room_tv
    data:
      command: >-
        input text "{{ text | regex_replace('[\"\\`$]', '') | replace(' ', '%s') }}"; sleep 0.3; input keyevent 66
resume_jellyfin:
  alias: Resume Jellyfin
  description: Launch Jellyfin on the Fire TV and continue the signed-in account's show
  mode: single
  sequence:
  - action: script.launch_jellyfin
  - action: shell_command.jellyfin_resume
ptz_left_1s:
  alias: PTZ Left 1s
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.active_ptz_camera
        state: tapo_1
      sequence:
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_1
          action: move
          argument: left
      - delay:
          milliseconds: 500
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_1
          action: stop
    - conditions:
      - condition: state
        entity_id: input_select.active_ptz_camera
        state: tapo_2
      sequence:
      - action: frigate.ptz
        data:
          entity_id: camera.tapo_2
          action: move
